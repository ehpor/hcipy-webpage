<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#1e2530">
    <title>HCIPy</title>
    <link rel="preload" href="{{ "fonts/NotoSans.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" media="screen">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="{{ if .Site.Params.docsSite }}https://hcipy.org{{ else }}{{ "" | relURL }}{{ end }}">HCIPy</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">
        <svg viewBox="0 0 30 30" width="24" height="24">
            <path stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-miterlimit="10" d="M4 7h22M4 15h22M4 23h22"/>
        </svg>
    </label>
    <ul class="nav-links">
        <li>
            <a href="https://github.com/ehpor/hcipy" target="_blank" rel="noopener" aria-label="GitHub">
                <svg width="20px" height="20px" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 512 499.36" focusable="false"><title>GitHub</title>
                    <path d="M256 0C114.64 0 0 114.61 0 256c0 113.09 73.34 209 175.08 242.9 12.8 2.35 17.47-5.56 17.47-12.34 0-6.08-.22-22.18-.35-43.54-71.2 15.49-86.2-34.34-86.2-34.34-11.64-29.57-28.42-37.45-28.42-37.45-23.27-15.84 1.73-15.55 1.73-15.55 25.69 1.81 39.21 26.38 39.21 26.38 22.84 39.12 59.92 27.82 74.5 21.27 2.33-16.54 8.94-27.82 16.25-34.22-56.84-6.43-116.6-28.43-116.6-126.49 0-27.95 10-50.8 26.35-68.69-2.63-6.48-11.42-32.5 2.51-67.75 0 0 21.49-6.88 70.4 26.24a242.65 242.65 0 0 1 128.18 0c48.87-33.13 70.33-26.24 70.33-26.24 14 35.25 5.18 61.27 2.55 67.75 16.41 17.9 26.31 40.75 26.31 68.69 0 98.35-59.85 120-116.88 126.32 9.19 7.9 17.38 23.53 17.38 47.41 0 34.22-.31 61.83-.31 70.23 0 6.85 4.61 14.81 17.6 12.31C438.72 464.97 512 369.08 512 256.02 512 114.62 397.37 0 256 0z" fill="currentColor" fill-rule="evenodd"/>
                </svg>
            </a>
        </li>
        {{ if not .Site.Params.docsSite }}
        <li><a href="{{ "news" | relURL }}">News</a></li>
        <li><a href="{{ "about" | relURL }}">About</a></li>
        <li><a href="{{ "team" | relURL }}">Team</a></li>
        <li><a href="https://docs.hcipy.org/">Documentation</a></li>
        {{ end }}
    </ul>
</nav>

<main>
{{ block "main" . }}{{ end }}
</main>

<footer class="container">
    <hr>
    <p>&copy; HCIPy project</p>
</footer>

</body>
</html>
